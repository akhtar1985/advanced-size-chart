<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="md-title">
  <title id="md-title">How to measure a dress: bust, waist, hip and length</title>
  <defs>
    <marker id="md-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <path d="M105 60 C112 70 128 70 135 60 L145 72 L156 104 L146 114 L150 152 L188 244 H52 L90 152 L94 114 L84 104 L95 72 Z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <g fill="none" stroke="#2563eb" stroke-width="1.25" stroke-dasharray="4 3">
    <line x1="72" y1="104" x2="168" y2="104" marker-start="url(#md-arrow)" marker-end="url(#md-arrow)"/>
    <line x1="76" y1="150" x2="164" y2="150" marker-start="url(#md-arrow)" marker-end="url(#md-arrow)"/>
    <line x1="66" y1="182" x2="174" y2="182" marker-start="url(#md-arrow)" marker-end="url(#md-arrow)"/>
    <line x1="42" y1="70" x2="42" y2="246" marker-start="url(#md-arrow)" marker-end="url(#md-arrow)"/>
  </g>
  <g fill="#374151" font-family="Helvetica, Arial, sans-serif" font-size="13">
    <text x="120" y="98" text-anchor="middle">Bust</text>
    <text x="120" y="144" text-anchor="middle">Waist</text>
    <text x="120" y="176" text-anchor="middle">Hip</text>
    <text x="32" y="160" transform="rotate(-90 32 160)" text-anchor="middle">Length</text>
  </g>
</svg>
