<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="mt-title">
  <title id="mt-title">How to measure a top: chest, shoulder, sleeve and length</title>
  <defs>
    <marker id="mt-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <path d="M150 62 C140 74 100 74 90 62 L68 70 L36 102 L60 128 L78 111 L78 236 L162 236 L162 111 L180 128 L204 102 L172 70 Z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <g fill="none" stroke="#2563eb" stroke-width="1.25" stroke-dasharray="4 3">
    <line x1="90" y1="52" x2="150" y2="52" marker-start="url(#mt-arrow)" marker-end="url(#mt-arrow)"/>
    <line x1="66" y1="76" x2="44" y2="118" marker-start="url(#mt-arrow)" marker-end="url(#mt-arrow)"/>
    <line x1="62" y1="150" x2="178" y2="150" marker-start="url(#mt-arrow)" marker-end="url(#mt-arrow)"/>
    <line x1="46" y1="68" x2="46" y2="238" marker-start="url(#mt-arrow)" marker-end="url(#mt-arrow)"/>
  </g>
  <g fill="#374151" font-family="Helvetica, Arial, sans-serif" font-size="13">
    <text x="120" y="46" text-anchor="middle">Shoulder</text>
    <text x="14" y="98" transform="rotate(-58 14 98)">Sleeve</text>
    <text x="120" y="144" text-anchor="middle">Chest</text>
    <text x="36" y="156" transform="rotate(-90 36 156)" text-anchor="middle">Length</text>
  </g>
</svg>
