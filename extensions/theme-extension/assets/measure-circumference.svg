<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="mc-title">
  <title id="mc-title">How to measure a ring or bracelet: circumference and diameter</title>
  <defs>
    <marker id="mc-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <circle cx="120" cy="150" r="44" fill="#e5e7eb" stroke="#6b7280" stroke-width="2"/>
  <circle cx="120" cy="150" r="26" fill="#f9fafb" stroke="#6b7280" stroke-width="2"/>
  <circle cx="120" cy="150" r="54" fill="none" stroke="#2563eb" stroke-width="1.25" stroke-dasharray="4 3"/>
  <g fill="none" stroke="#2563eb" stroke-width="1.25" stroke-dasharray="4 3">
    <line x1="66" y1="150" x2="174" y2="150" marker-start="url(#mc-arrow)" marker-end="url(#mc-arrow)"/>
  </g>
  <g fill="#374151" font-family="Helvetica, Arial, sans-serif" font-size="13">
    <text x="120" y="84" text-anchor="middle">Circumference</text>
    <text x="120" y="230" text-anchor="middle">Diameter</text>
  </g>
</svg>
