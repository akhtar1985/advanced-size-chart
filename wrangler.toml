name = "advanced-size-chart"
main = "worker/index.js"
compatibility_date = "2026-10-01"
compatibility_flags = ["nodejs_compat"]

# Static admin SPA (no build step). The Worker injects the API key into index.html.
[assets]
directory = "./admin"
binding = "ASSETS"
not_found_handling = "single-page-application"
# Without this the asset layer serves index.html before the Worker runs, so the
# %SHOPIFY_API_KEY% / %APP_HANDLE% placeholders are never replaced.
run_worker_first = true

# OAuth installs, shop metadata and the billing cache.
[[kv_namespaces]]
binding = "SHOPS"
id = "REPLACE_WITH_KV_NAMESPACE_ID"

[vars]
# Safe to expose. Secrets are set with `wrangler secret put` and never committed.
SHOPIFY_API_KEY = "4fb063ac0209111ca754ff549e83158a"
APP_HANDLE = "advanced-size-chart-asc"
# Partner ID (the number in the Partner Dashboard URL), not the Dev Dashboard
# organization ID — the Partner API rejects the Dev Dashboard ID.
SHOPIFY_PARTNER_ORG_ID = "1823143"
SHOPIFY_PARTNER_APP_ID = "449359773697"

[triggers]
# Keeps $app:billing fresh so expired trials hide the storefront chart
# even for shops that never open the app again.
crons = ["17 * * * *"]

# Secrets (run once per environment):
#   wrangler secret put SHOPIFY_API_SECRET          Client secret (OAuth, session tokens, webhook HMAC)
#   wrangler secret put SHOPIFY_PARTNER_API_TOKEN   Partner org token with Manage apps permission
