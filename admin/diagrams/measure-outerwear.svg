<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 240 300" role="img" aria-labelledby="mo-title">
  <title id="mo-title">How to measure a jacket: chest, shoulder, sleeve and length</title>
  <defs>
    <marker id="mo-arrow" markerWidth="6" markerHeight="6" refX="5" refY="3" orient="auto">
      <path d="M0 0 L6 3 L0 6 Z" fill="#2563eb"/>
    </marker>
  </defs>
  <path d="M150 62 C140 74 100 74 90 62 L66 70 L34 104 L58 130 L78 112 L78 242 L162 242 L162 112 L182 130 L206 104 L174 70 Z" fill="#f3f4f6" stroke="#9ca3af" stroke-width="1.5"/>
  <line x1="120" y1="80" x2="120" y2="242" stroke="#d1d5db" stroke-width="1.5"/>
  <g fill="none" stroke="#2563eb" stroke-width="1.25" stroke-dasharray="4 3">
    <line x1="90" y1="52" x2="150" y2="52" marker-start="url(#mo-arrow)" marker-end="url(#mo-arrow)"/>
    <line x1="64" y1="78" x2="42" y2="120" marker-start="url(#mo-arrow)" marker-end="url(#mo-arrow)"/>
    <line x1="62" y1="156" x2="178" y2="156" marker-start="url(#mo-arrow)" marker-end="url(#mo-arrow)"/>
    <line x1="44" y1="68" x2="44" y2="244" marker-start="url(#mo-arrow)" marker-end="url(#mo-arrow)"/>
  </g>
  <g fill="#374151" font-family="Helvetica, Arial, sans-serif" font-size="13">
    <text x="120" y="46" text-anchor="middle">Shoulder</text>
    <text x="12" y="100" transform="rotate(-58 12 100)">Sleeve</text>
    <text x="120" y="150" text-anchor="middle">Chest</text>
    <text x="34" y="160" transform="rotate(-90 34 160)" text-anchor="middle">Length</text>
  </g>
</svg>
