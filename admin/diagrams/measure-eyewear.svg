  <rect x="138" y="116" width="68" height="52" rx="16" fill="#f3f4f6" stroke="#6b7280" stroke-width="2"/>
  <path d="M102 136 Q120 126 138 136" fill="none" stroke="#6b7280" stroke-width="2"/>
