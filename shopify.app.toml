# Learn more about configuring your app at https://shopify.dev/docs/apps/tools/cli/configuration

client_id = "4fb063ac0209111ca754ff549e83158a"
name = "Advanced Size Chart"
handle = "advanced-size-chart-asc"
# Replace with your deployed Cloudflare Worker origin (see docs/deploy.md).
application_url = "https://advanced-size-chart.example.workers.dev"
embedded = true

[build]
# Point the app at the local Worker tunnel while `shopify app dev` runs.
automatically_update_urls_on_dev = true

[access.admin]
direct_api_mode = "online"
embedded_app_direct_api_access = true

[access_scopes]
scopes = "write_products,read_products,write_metaobjects,read_metaobjects,write_app_proxy"

[auth]
redirect_urls = [ "https://advanced-size-chart.example.workers.dev/auth/callback" ]

# Storefront fit-feedback votes are posted to /apps/size-chart/feedback and
# forwarded to the Worker, which verifies Shopify's signature before saving.
[app_proxy]
url = "https://advanced-size-chart.example.workers.dev/proxy"
prefix = "apps"
subpath = "size-chart"

[webhooks]
api_version = "2026-10"

[[webhooks.subscriptions]]
uri = "https://advanced-size-chart.example.workers.dev/webhooks"
topics = [ "app/uninstalled" ]
compliance_topics = [ "customers/data_request", "customers/redact", "shop/redact" ]

# ── Size Chart metaobject ──────────────────────────────────────────────────────

[metaobjects.app.size_chart]
name = "Size Chart"
display_name_field = "name"
access.storefront = "public_read"

[metaobjects.app.size_chart.fields.name]
name = "Name"
type = "single_line_text_field"
required = true

[metaobjects.app.size_chart.fields.default_unit]
name = "Default Unit"
type = "single_line_text_field"

[metaobjects.app.size_chart.fields.size_systems]
name = "Size Systems"
type = "list.single_line_text_field"

[metaobjects.app.size_chart.fields.tables]
name = "Tables"
type = "json"

[metaobjects.app.size_chart.fields.measure_image]
name = "Measure Image URL"
type = "single_line_text_field"

[metaobjects.app.size_chart.fields.measure_instructions]
name = "Measure Instructions"
type = "multi_line_text_field"

[metaobjects.app.size_chart.fields.fit_notes]
name = "Fit Notes"
type = "single_line_text_field"

[metaobjects.app.size_chart.fields.translations]
name = "Translations"
type = "json"

# ── Per-product metafield (override) ──────────────────────────────────────────

[product.metafields.app.size_chart]
name = "Size Chart"
description = "Size chart override for this product"
type = "metaobject_reference<$app:size_chart>"

  [product.metafields.app.size_chart.access]
  admin = "merchant_read_write"
  storefront = "public_read"

# ── Shop-level metafields ──────────────────────────────────────────────────────

[shop.metafields.app.rules]
name = "Size Chart Rules"
description = "Ordered list of assignment rules"
type = "json"

  [shop.metafields.app.rules.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[shop.metafields.app.settings]
name = "Size Chart Settings"
description = "Global display settings"
type = "json"

  [shop.metafields.app.settings.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[shop.metafields.app.charts_index]
name = "Size Chart Storefront Index"
description = "Published chart data used by the theme extension"
type = "json"

  [shop.metafields.app.charts_index.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[shop.metafields.app.billing]
name = "Size Chart Billing Status"
description = "Subscription state used by the theme extension"
type = "json"

  [shop.metafields.app.billing.access]
  admin = "merchant_read_write"
  storefront = "public_read"

[shop.metafields.app.overrides]
name = "Size Chart Product Overrides"
description = "Products that were given a chart directly from the Assignment page"
type = "json"

  [shop.metafields.app.overrides.access]
  admin = "merchant_read_write"

# The storefront extension reads shop metafields through Liquid and loads its
# assets from Shopify's CDN, so it calls no external server.
[network_access]
allowed_sources = []

[sidekick]
extensions_summary = "Manage size charts stored as app-owned metaobjects"
